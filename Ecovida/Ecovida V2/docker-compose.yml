services:
  postgres:
    image: postgres:16-alpine
    container_name: ecovida-postgres
    environment:
      POSTGRES_USER: ecovida
      POSTGRES_PASSWORD: ecovida123
      POSTGRES_DB: ecovida
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecovida -d ecovida"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - ecovida-net

  usuarios-service:
    build:
      context: ./usuarios-service
      dockerfile: Dockerfile
    container_name: usuarios-service
    ports:
      - "3000:3000"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=ecovida
      - DB_PASS=ecovida123
      - DB_NAME=ecovida
      - JWT_SECRET=${JWT_SECRET:-supersecreto-local}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ecovida-net

  catalogo-service:
    build:
      context: ./catalogo-service
      dockerfile: Dockerfile
    container_name: catalogo-service
    ports:
      - "3001:3001"
    volumes:
      - catalogo-uploads:/usr/src/app/uploads
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=ecovida
      - DB_PASS=ecovida123
      - DB_NAME=ecovida
      - JWT_SECRET=${JWT_SECRET:-supersecreto-local}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ecovida-net

  carrito-service:
    build:
      context: ./carrito-service
      dockerfile: Dockerfile
    container_name: carrito-service
    ports:
      - "3002:3002"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=ecovida
      - DB_PASS=ecovida123
      - DB_NAME=ecovida
      - JWT_SECRET=${JWT_SECRET:-supersecreto-local}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ecovida-net

  pedidos-service:
    build:
      context: ./pedidos-service
      dockerfile: Dockerfile
    container_name: pedidos-service
    ports:
      - "3003:3003"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=ecovida
      - DB_PASS=ecovida123
      - DB_NAME=ecovida
      - JWT_SECRET=${JWT_SECRET:-supersecreto-local}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ecovida-net

  envios-service:
    build:
      context: ./envios-service
      dockerfile: Dockerfile
    container_name: envios-service
    ports:
      - "3004:3004"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=ecovida
      - DB_PASS=ecovida123
      - DB_NAME=ecovida
      - JWT_SECRET=${JWT_SECRET:-supersecreto-local}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ecovida-net

  frontend:
    build:
      context: ../ecovida-frontend
      dockerfile: Dockerfile
    container_name: ecovida-frontend
    ports:
      - "3005:80"
    depends_on:
      - usuarios-service
      - catalogo-service
      - carrito-service
      - pedidos-service
      - envios-service
    networks:
      - ecovida-net

networks:
  ecovida-net:

volumes:
  pgdata:
  catalogo-uploads:
